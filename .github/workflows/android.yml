name: Build Flutter APK

on:
  push:
    branches: [ main ]      # runs on every push to main
  workflow_dispatch:        # manual trigger button in the UI

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout source
      - name: Clone repo
        uses: actions/checkout@v4

      # 2. Install Java 17 (AGP 8.x needs it)
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      # 3. Install Flutter (stable channel)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true          # caches SDK between runs

      # 4. Get dependencies
      - run: flutter pub get

      # 5. Static analysis (optional but recommended)
      - run: flutter analyze --fatal-infos

      # 6. Run tests (optional but recommended)
      - run: flutter test

      # 7. Build RELEASE APK
      - run: flutter build apk --release

      # 8. Upload APK as CI artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
